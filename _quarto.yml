  search: true
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    background: "#1E2761"
    foreground: "#ffffff"
    logo: assets/logo-unemat.jpg
    logo-alt: "Brasão da UNEMAT"
    left:
      - href: index.qmd
        text: Início
      - href: municipios/index.qmd
        text: Municípios
      - text: Dimensões
        menu:
          - href: dimensoes/d1.qmd
            text: "D1 · Perfil econômico-produtivo"
          - href: dimensoes/d2.qmd
            text: "D2 · Áreas de especial interesse"
          - href: dimensoes/d3.qmd
            text: "D3 · Perfil sociodemográfico"
          - href: dimensoes/d4.qmd
            text: "D4 · Perfil ambiental"
          - href: dimensoes/d5.qmd
            text: "D5 · Infraestrutura"
          - href: dimensoes/d6.qmd
            text: "D6 · Gestão pública"
      - text: Revisão de literatura
        menu:
          - href: revisao/index.qmd
            text: "Situação das áreas"
          - href: revisao/economica.qmd
            text: "Área econômica — matriz FOFA"
          - href: revisao/estudos.qmd
            text: "Área econômica — estudos do corpus"
      - href: dados/index.qmd
