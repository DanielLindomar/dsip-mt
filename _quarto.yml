project:
  type: website
  output-dir: _site
  resources:
    - arquivos/
    - dimensoes/figuras/

website:
  title: "Observatório DSIP-MT"
  description: "Resultados do Projeto DSIP-MT — Pantanal Norte Mato-grossense (Convênio 984799/2025 SUDECO–UNEMAT)"
  site-url: https://daniellindomar.github.io/dsip-mt/
  favicon: assets/favicon.png
  repo-url: https://github.com/DanielLindomar/dsip-mt
  repo-actions: [issue]
  search: true
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    background: "#1E2761"
    foreground: "#ffffff"
    logo: assets/logo-unemat-branco.png
    logo-alt: "UNEMAT — Universidade do Estado de Mato Grosso"
    left:
      - href: index.qmd
        text: Início
      - href: municipios/index.qmd
        text: Municípios
      - href: indicadores/index.qmd
        text: Indicadores
      - text: Dimensões
        menu:
          - href: dimensoes/d1.qmd
            text: "D1 · Perfil econômico-produtivo"
          - href: dimensoes/d2.qmd
            text: "D2 · Áreas de especial interesse"
          - href: dimensoes/d3.qmd
            text: "D3 · Perfil sociodemográfico"
          - href: dimensoes/d4.qmd
            text: "D4 · Perfil ambiental"
          - href: dimensoes/d5.qmd
            text: "D5 · Infraestrutura"
          - href: dimensoes/d6.qmd
            text: "D6 · Gestão pública"
      - text: Revisão de literatura
        menu:
          - href: revisao/index.qmd
            text: "As cinco áreas-chave"
          - href: revisao/economica.qmd
            text: "Econômica"
          - href: revisao/infraestrutura.qmd
            text: "Infraestrutura"
          - href: revisao/setor-publico.qmd
            text: "Setor Público"
          - href: revisao/sociodemografica.qmd
            text: "Sociodemográfica"
          - href: revisao/ambiental.qmd
            text: "Ambiental"
          - href: revisao/estudos.qmd
            text: "Estudos do corpus (todas as áreas)"
      - href: dados/index.qmd
        text: Dados
      - href: biblioteca/index.qmd
        text: Biblioteca
      - href: sobre.qmd
        text: Sobre
  page-footer:
    left: |
      Projeto DSIP-MT · Convênio 984799/2025 SUDECO–UNEMAT · Versão preliminar para a equipe do projeto · Atualizado em 07/10/2026 · Encontrou um erro? Use o link "Criar uma issue" (GitHub) ou escreva à coordenação.
    right: |
      ![UNEMAT](/assets/logo-unemat.png){height=40} ![SUDECO](/assets/logo-sudeco.png){height=40}

format:
  html:
    theme: [cosmo, estilo.scss]
    lang: pt-BR
    toc: true
    toc-depth: 2
    toc-title: "Nesta página"
    smooth-scroll: true
    link-external-newwindow: true
    lightbox: auto
    include-after-body: assets/glossario.html

execute:
  echo: false
  warning: false
  message: false

engine: knitr
