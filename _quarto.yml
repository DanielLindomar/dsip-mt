      - href: biblioteca/index.qmd
        text: Biblioteca
      - href: sobre.qmd
        text: Sobre
  page-footer:
    left: |
      Projeto DSIP-MT · Convênio 984799/2025 SUDECO–UNEMAT · Versão preliminar para a equipe do projeto
    right: |
      ![UNEMAT](/assets/logo-unemat.jpg){height=36} ![Governo de Mato Grosso](/assets/brasao-mt.jpg){height=36} ![SUDECO](/assets/logo-sudeco.png){height=36}

format:
  html:
    theme: [cosmo, estilo.scss]
    lang: pt-BR
    toc: true
    toc-depth: 2
    toc-title: "Nesta página"
    smooth-scroll: true
    link-external-newwindow: true

execute:
  echo: false
  warning: false
  message: false

engine: knitr
